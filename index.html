<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Glasshouse: a live dashboard for Samuel's Home Assistant — lights, climate, media, the 3D printer and the house schedule, on one screen."
    />
    <!-- The app paints its own sky gradient day and night, so a single dark
         chrome colour is correct in both; it is not tied to prefers-color-scheme. -->
    <meta name="theme-color" content="#0a0d12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="application-name" content="Glasshouse" />
    <!-- mobile-web-app-capable is the standard name; the apple- prefixed one is
         still what older iOS reads, so both are present on purpose. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Glasshouse" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS ignores the manifest icons and won't take an SVG here — given one, it
         saves a screenshot of the page as the home-screen icon. The PNG is
         public/icon.svg rendered at 180x180 with the corners squared off, because
         iOS applies its own mask and paints any transparency black. The 192/512
         PNGs in manifest.webmanifest come from the same SVG. Re-render all three
         if icon.svg changes. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Glasshouse · Home Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
