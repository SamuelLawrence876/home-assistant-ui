name: CI

# Runs on branches and PRs. Same gates as deploy.yml, in the same order, so a
# green CI means the deploy will get that far too.
#
#   lint  -> test -> build   (cheap, seconds)
#   console gate -> screenshot gate   (browser, minutes)
#
# Re-bless the screenshot baseline
# -------------------------------
# The committed baseline has to be shot here, on the runner. One shot on
# Windows or macOS will not match (different fonts), and pixel-diff.mjs then
# skips the comparison and passes — NOT BLESSED, with a green tick:
#     gh workflow run ci.yml -f bless=true
#     gh run download <run-id> -n visual-baseline -D visual-baseline
#     git add visual-baseline && git commit -m "chore: re-bless visual baseline"
# `node scripts/visual-check.mjs --bless` locally is for looking at diffs only;
# committing what it writes disarms this gate.
#
# Runner image
# ------------
# Every job is pinned to ubuntu-24.04, not ubuntu-latest, because the fonts
# the screenshots are drawn with come from the image. GitHub moves
# ubuntu-latest to 26.04 from 2026-10-19, which would turn every tile red for a
# reason no code change can fix. Moving the pin is a deliberate act: change
# runs-on in every job here AND in deploy.yml, then re-bless on the new runner.
#
# Full explanation in scripts/README.md.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bless:
        description: "Re-shoot the visual baseline on this runner and upload it as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + test + build
    runs-on: ubuntu-24.04   # pinned: screenshot fonts come from the image; moving it means re-blessing (see header)
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bless }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vite/esbuild does no scope analysis, so a typo'd identifier builds
      # cleanly and only throws when its lazy-loaded tab is opened. ESLint's
      # no-undef is the only gate that catches it — run it before the build.
      - name: Lint
        run: npm run lint

      # vitest run — non-watch, exits when done. Covers date maths, the
      # optimistic on/off logic, the role rules and the calendar range.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  visual:
    name: Console + screenshot gates
    needs: checks
    runs-on: ubuntu-24.04   # pinned: screenshot fonts come from the image; moving it means re-blessing (see header)
    timeout-minutes: 25
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.bless }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds its own bundle with VITE_HA_URL="" (mock state, so nothing the
      # house is doing can move the pixels), loads all 7 tabs and fails on any
      # console error, then shoots 7 tabs x 2 viewports and diffs them against
      # visual-baseline/. See the header of this file to re-bless.
      - name: Console + screenshot gates
        run: |
          set -o pipefail
          node scripts/visual-check.mjs 2>&1 | tee visual.log
          if grep -q "NOT BLESSED" visual.log; then
            echo "::warning::Screenshot gate did not run — no baseline for this runner. See scripts/README.md."
          fi

      # Without the images, a red pixel gate is un-debuggable.
      - name: Upload screenshots + diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-candidate
          path: dist-visual-shots
          # The console gate runs first, so a failure there means no shots exist.
          if-no-files-found: ignore
          retention-days: 7

  bless:
    name: Re-bless visual baseline
    runs-on: ubuntu-24.04   # pinned: screenshot fonts come from the image; moving it means re-blessing (see header)
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bless }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Shoot a fresh baseline
        run: node scripts/visual-check.mjs --bless

      # Deliberately NOT committed by CI. New baselines are what every later
      # run is judged against — a human looks at them first.
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: visual-baseline
          retention-days: 14
