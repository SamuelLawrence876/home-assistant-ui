name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vite/esbuild does no scope analysis, so a typo'd identifier builds
      # cleanly and only throws when its lazy-loaded tab is opened. ESLint's
      # no-undef is the only gate that catches it — run it before the build.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
