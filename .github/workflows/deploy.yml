name: Deploy

# Builds the Glasshouse UI and ships it to the prod S3 bucket fronted by
# CloudFront. Bucket + distribution are provisioned by the backend CDK stack
# in the sibling repo — values are supplied here as repo variables.
#
# Auth: GitHub OIDC → assume the same IAM role the backend uses. Role's
# trust policy must allow this repo's OIDC subject (refs/heads/main).
#
# The bucket and distribution are NOT configured here — they are read out of the
# CloudFormation stack at deploy time (see "Resolve stack outputs" below). They
# used to be repo variables, which meant this repo held a copy of two ids owned
# by a stack in a different repo: if CDK ever replaced the distribution or the
# bucket, this workflow would keep uploading to the old one and succeed, and the
# site would silently stop updating. Reading them from the stack removes that.
#
# Gates, all before the first AWS call, and all four block:
#   lint -> test -> console errors -> screenshot diff -> build -> upload.
# The screenshot diff only compares when the committed baseline was shot on the
# same platform as this runner — pixel-diff.mjs checks visual-baseline/meta.json
# and prints NOT BLESSED rather than failing a deploy for a font difference no
# code change can fix. That is why the baseline is shot HERE and committed from
# the artifact: `gh workflow run ci.yml -f bless=true`, download, commit. A
# baseline re-blessed on a dev machine will silently disarm this step, which is
# what the grep below is watching for. See scripts/README.md.
#
# Required repo configuration:
#   Secrets:
#     AWS_DEPLOY_ROLE_ARN     — ARN of the IAM role to assume
#   Variables:
#     VITE_HA_URL             — Home Assistant base URL (embedded in bundle at build time).
#                               Currently the Tailscale Funnel host, hit directly.
#     VITE_SPOTIFY_CLIENT_ID  — Spotify Web API client id for the Media tab (PKCE, public)

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  # Must match config.stackName in the backend repo's infrastructure/lib/config.ts.
  STACK_NAME: home-assistant

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy — production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same gates as ci.yml, in the same order: cheap ones first, and every
      # one of them blocks the S3 sync below. Pushing straight to main is the
      # normal flow here, so these have to run on the deploy — relying on the
      # PR run would mean most deploys are ungated.
      #
      # esbuild won't catch an undefined identifier, and a lazy-loaded view
      # only fails when its tab is opened — i.e. in production.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Mock-mode build (VITE_HA_URL="") loaded in a real browser: fails on any
      # console error, then screenshots 7 tabs x 2 viewports and diffs them
      # against visual-baseline/.
      #
      # Re-bless the baseline when a change is meant to move pixels:
      #     node scripts/visual-check.mjs --bless     # then commit visual-baseline/
      # For the Linux images this job compares against:
      #     gh workflow run ci.yml -f bless=true
      #     gh run download <run-id> -n visual-baseline -D visual-baseline
      # Full explanation in scripts/README.md.
      - name: Console + screenshot gates
        run: |
          set -o pipefail
          node scripts/visual-check.mjs 2>&1 | tee visual.log
          if grep -q "NOT BLESSED" visual.log; then
            echo "::warning::Screenshot gate did not run — no baseline for this runner. See scripts/README.md."
          fi

      - name: Upload screenshots + diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-candidate
          path: dist-visual-shots
          # The console gate runs first, so a failure there means no shots exist.
          if-no-files-found: ignore
          retention-days: 7

      # The real bundle, pointed at Home Assistant. Built after the gates so a
      # failing gate never produces something that could be uploaded.
      - name: Build
        env:
          VITE_HA_URL: ${{ vars.VITE_HA_URL }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Ask the stack where to deploy, rather than trusting a copied-out id.
      # Fails loudly if either output is missing: a red deploy is recoverable,
      # a green deploy that uploaded to the wrong bucket is not — it looks fine
      # and the live site just never changes.
      - name: Resolve stack outputs
        id: stack
        run: |
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' --output json)
          bucket=$(jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue' <<<"$outputs")
          dist=$(jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue' <<<"$outputs")
          if [ -z "$bucket" ] || [ -z "$dist" ]; then
            echo "::error::stack '$STACK_NAME' did not yield both outputs (bucket='$bucket' distribution='$dist')"
            exit 1
          fi
          echo "Deploying to bucket=$bucket distribution=$dist"
          {
            echo "bucket=$bucket"
            echo "distribution-id=$dist"
          } >> "$GITHUB_OUTPUT"

      # Only dist/assets/* carries a content hash in its filename, so only that
      # is safe to mark immutable. index.html, icon.svg and manifest.webmanifest
      # keep stable names and are copied separately below — marking those
      # immutable would freeze the app icon and PWA manifest in every browser
      # that had already fetched them, for a year, with no way to bust it.
      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/ "s3://${{ steps.stack.outputs.bucket }}/" \
            --delete \
            --exclude index.html \
            --exclude icon.svg \
            --exclude manifest.webmanifest \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload unhashed root files (short cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ steps.stack.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/icon.svg "s3://${{ steps.stack.outputs.bucket }}/icon.svg" \
            --cache-control "public, max-age=300, must-revalidate" \
            --content-type "image/svg+xml"
          aws s3 cp dist/manifest.webmanifest "s3://${{ steps.stack.outputs.bucket }}/manifest.webmanifest" \
            --cache-control "public, max-age=300, must-revalidate" \
            --content-type "application/manifest+json"

      # Every unhashed path gets invalidated; /assets/* never needs it.
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution-id }}" \
            --paths "/" "/index.html" "/icon.svg" "/manifest.webmanifest"
